name: Check and deploy Kaimar

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check, build and verify private draft isolation
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm@11
          build-cmd: npm run check && npm run test:content && npm run verify -- --privacy

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static output
        id: deployment
        uses: actions/deploy-pages@v5
